[workspace]
members = [
    "crates/quadrant-domain",
    "crates/quadrant-application",
    "crates/quadrant-storage",
    "crates/quadrant-platform",
    "crates/quadrant-protocol",
    "crates/quadrant-agent",
    "crates/quadrant-ui",
    "crates/quadrant-ui-gallery",
    "crates/quadrant-app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
repository = "https://github.com/wadaxiyang/Quadrant"

[workspace.dependencies]
quadrant-domain = { path = "crates/quadrant-domain" }
quadrant-application = { path = "crates/quadrant-application" }
quadrant-storage = { path = "crates/quadrant-storage" }
quadrant-platform = { path = "crates/quadrant-platform" }
quadrant-protocol = { path = "crates/quadrant-protocol" }
quadrant-ui = { path = "crates/quadrant-ui" }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
jiff = "0.2.35"
interprocess = { version = "2.4.3", features = ["tokio"] }
notify-rust = "4.18.0"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
single-instance = "0.3.3"
slint = "=1.17.1"
slint-build = "=1.17.1"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }

[workspace.dependencies.global-hotkey]
version = "0.8.0"

[workspace.dependencies.tray-icon]
version = "0.24.2"
default-features = false

[workspace.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Registry",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
]

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
